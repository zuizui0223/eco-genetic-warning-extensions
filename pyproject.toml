[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-genetic-warning-extensions"
version = "0.1.0"
description = "Protocol-locked extensions for finite eco-genetic warning models"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
reproducibility = ["build>=1.2"]

[project.scripts]
protocol002 = "eco_genetic_warning_extensions.protocol002_cli:main"

[project.urls]
Repository = "https://github.com/zuizui0223/eco-genetic-warning-extensions"
"Mechanistic parent" = "https://github.com/zuizui0223/eco-genetic-criticality"
"Integrated manuscript" = "https://github.com/zuizui0223/eco-genetic-warning-extensions/tree/main/manuscript"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
