[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-genetic-warning-extensions"
version = "0.1.0"
description = "Protocol-locked extensions for finite eco-genetic warning models"
requires-python = ">=3.11"

[project.scripts]
protocol002 = "eco_genetic_warning_extensions.protocol002_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
