name: Campanula colonization realised-visitation state test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked analysis dependencies
        run: python -m pip install --upgrade numpy pandas scikit-learn
      - name: Run preregistered realised-visitation analysis
        run: |
          python scripts/run_campanula_colonization_visitation_state_test_key_corrected.py \
            --output artifacts/empirical/campanula_colonization_visitation_result.json
      - name: Validate source and decision contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('artifacts/empirical/campanula_colonization_visitation_result.json').read_text(encoding='utf-8'))
          assert d['bootstrap']['replicates'] == 10000
          assert d['bootstrap']['rng_seed'] == 20260825
          assert d['bootstrap']['held_out_unit'] == 'experimental.population'
          assert d['source_lock']['seed']['md5'] == 'b84fa5c83513dbe75c0bf7840d1c74aa'
          assert d['source_lock']['pollinator']['md5'] == '81e0deaa78a6a97e1211484cb9d0d3b3'
          assert d['population_key_gate_correction']['first_run_outcome_model_fitted'] is False
          assert d['decision'] == 'not_identifiable_for_primary_endpoint'
          assert d.get('reason') == 'nonfinite_visits_per_flower'
          print(json.dumps({'decision': d['decision'], 'reason': d['reason']}, sort_keys=True))
          PY
      - name: Upload derived result only
        uses: actions/upload-artifact@v4
        with:
          name: campanula-colonization-visitation-result
          path: artifacts/empirical/campanula_colonization_visitation_result.json
          if-no-files-found: error
          retention-days: 30
