name: Warning-blind frontier reproducibility Phase C

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-c:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout extension repo
        uses: actions/checkout@v4
        with:
          path: extension
      - name: Checkout exact parent scientific commit
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages and test runner
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e upstream
          python -m pip install -e extension
      - name: Verify locked Phase-C manifest
        working-directory: extension
        run: python -m pytest -q tests/test_frontier_reproducibility_phase_c_manifest.py
      - name: Run two high-rep warning-blind Phase-C cells
        working-directory: extension
        run: |
          mkdir -p artifacts/frontier_refinement/phase_c
          for i in $(seq 0 1); do
            python scripts/run_frontier_reproducibility_phase_c.py \
              --upstream-checkout ../upstream \
              --cell-index "$i" \
              --output "artifacts/frontier_refinement/phase_c/cell_${i}.json"
          done
      - name: Aggregate Phase-C reproducibility result
        working-directory: extension
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('artifacts/frontier_refinement/phase_c').glob('cell_*.json')):
              a=json.loads(p.read_text())
              assert a['calibration_scope'] == 'trait_loss_only'
              rows.append({
                  **a['cell'],
                  'regime':a['regime'],
                  'pooled_trait_loss_rate':a['pooled_trait_loss_rate'],
                  'seed_rates':[b['trait_loss_rate'] for b in a['seed_blocks']],
                  'baseline_eligible_by_seed':[b['baseline_eligible_count'] for b in a['seed_blocks']],
                  'seed_rate_range':a['seed_rate_range'],
                  'highrep_support_sufficient':a['highrep_support_sufficient'],
                  'status_counts':a['status_counts'],
              })
          summary={
              'stage':'warning-blind frontier reproducibility audit Phase C summary',
              'calibration_scope':'trait_loss_only',
              'cell_count':len(rows),
              'cells':rows,
          }
          out=Path('artifacts/frontier_refinement/phase_c_summary.json')
          out.write_text(json.dumps(summary, indent=2, sort_keys=True)+'\n')
          for row in rows:
              print(row)
          PY
      - name: Upload Phase-C artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warning-blind-frontier-reproducibility-phase-c
          path: |
            extension/artifacts/frontier_refinement/phase_c/*.json
            extension/artifacts/frontier_refinement/phase_c_summary.json
          if-no-files-found: error
          retention-days: 90
