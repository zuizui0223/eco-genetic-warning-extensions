name: Warning-blind migration condition Phase E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-e:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout extension repo
        uses: actions/checkout@v4
        with:
          path: extension
      - name: Checkout exact parent scientific commit
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages and test runner
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e upstream
          python -m pip install -e extension
      - name: Verify Phase-E manifest and exact migration bounds
        working-directory: extension
        run: python -m pytest -q tests/test_migration_condition_phase_e.py
      - name: Run paired migration-condition campaign
        working-directory: extension
        run: |
          mkdir -p artifacts/migration_condition
          python scripts/run_migration_condition_phase_e.py \
            --upstream-checkout ../upstream \
            --output artifacts/migration_condition/phase_e_full.json
      - name: Build compact condition summary
        working-directory: extension
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('artifacts/migration_condition/phase_e_full.json')
          artifact = json.loads(source.read_text())
          summary = {
              'stage': artifact['stage'],
              'calibration_scope': artifact['calibration_scope'],
              'manifest': artifact['manifest'],
              'source_preparation_count': artifact['source_preparation_count'],
              'migration_condition_summaries': artifact['migration_condition_summaries'],
              'paired_loss_status_vs_isolation': artifact['paired_loss_status_vs_isolation'],
          }
          out = Path('artifacts/migration_condition/phase_e_summary.json')
          out.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          for row in summary['migration_condition_summaries']:
              print(row)
          print('paired vs isolation:')
          for row in summary['paired_loss_status_vs_isolation']:
              print(row)
          PY
      - name: Upload Phase-E artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warning-blind-migration-condition-phase-e
          path: |
            extension/artifacts/migration_condition/phase_e_full.json
            extension/artifacts/migration_condition/phase_e_summary.json
          if-no-files-found: error
          retention-days: 90
