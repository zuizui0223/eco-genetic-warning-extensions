name: Operator-balance route margin — prospective fate test

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/operator_balance_margin_fate_protocol.json'
      - 'src/eco_genetic_warning_extensions/operator_balance_route_margin.py'
      - 'src/eco_genetic_warning_extensions/operator_balance_margin_fate.py'
      - 'scripts/run_operator_balance_margin_fate.py'
      - 'tests/test_operator_balance_route_margin.py'
      - 'tests/test_operator_balance_route_margin_parent.py'
      - 'tests/test_operator_balance_margin_fate_protocol.py'
      - 'docs/OPERATOR_BALANCE_ROUTE_MARGIN_THEOREM_2026-09-06.md'
      - '.github/workflows/operator-balance-margin-fate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-margin-fate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4

      - name: Checkout pinned parent simulator
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: b7ee738767c92307d6d23a85a3eeb857faf6ddfb
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned parent and extension
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e upstream
          python -m pip install -e .

      - name: Verify theorem and prospective contract before outcomes
        run: |
          python -m pytest -q \
            tests/test_operator_balance_route_margin.py \
            tests/test_operator_balance_route_margin_parent.py \
            tests/test_operator_balance_margin_fate_protocol.py

      - name: Run exactly the locked 12,000-trajectory fate test
        run: |
          mkdir -p route_margin_output
          python scripts/run_operator_balance_margin_fate.py \
            --summary route_margin_output/summary.json \
            --records route_margin_output/records.json

      - name: Verify direction-independent outcome schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('route_margin_output/summary.json').read_text())
          assert s['status']=='completed_from_locked_protocol'
          assert s['n_records']==12000
          assert s['n_paired_keys']==3000
          audit=s['exact_transition_audit']
          assert audit['mismatches']==0
          assert audit['patch_generations_checked']==12000*40*4
          p=s['direct_feedback_extension']
          assert p['RR_minus_AA_DID']['n']==3000
          assert p['decision'] in {
            'resolved_preferential_RR_route_repair',
            'resolved_opposite_direction',
            'unresolved',
          }
          marker=s['full_denominator_marker_generation_20_to_loss_generation_40']
          assert set(marker)=={'AA_full','RR_full','pooled_full'}
          for cell in marker.values():
            assert cell['n'] > 0
            assert cell['events'] + cell['non_events'] == cell['n']
            assert cell['sensitivity'] is None or 0 <= cell['sensitivity'] <= 1
            assert cell['specificity'] is None or 0 <= cell['specificity'] <= 1
            assert cell['binary_auc'] is None or 0 <= cell['binary_auc'] <= 1
          print('direction-independent route-margin outcome contract: PASS')
          PY

      - name: Upload prospective route-margin results
        uses: actions/upload-artifact@v4
        with:
          name: operator-balance-route-margin-fate
          path: route_margin_output/
          if-no-files-found: error
