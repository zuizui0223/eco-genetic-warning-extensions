name: Protocol 002 Stage I wave 002

on:
  push:
    branches: ["feat/protocol-002-stage1-wave-002"]
    paths:
      - ".github/workflows/protocol-002-stage1-wave-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-wave:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        batch_index: [9, 10, 11, 12, 13, 14, 15, 16, 17]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout extension repo
        uses: actions/checkout@v4
        with:
          path: extension
      - name: Checkout pinned upstream repo
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install extension
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e extension
      - name: Run batch partition tests
        working-directory: extension
        run: python -m pytest -q tests/test_protocol002_stage1_batch.py
      - name: Run Stage I batch
        working-directory: extension
        env:
          BATCH_INDEX: ${{ matrix.batch_index }}
        run: |
          OUTPUT="artifacts/protocol002/stage1_batches/batch_$(printf '%03d' "$BATCH_INDEX").json"
          python scripts/run_protocol002_stage1_batch.py \
            --upstream-checkout ../upstream \
            --batch-index "$BATCH_INDEX" \
            --output "$OUTPUT"
      - name: Upload Stage I batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: protocol002-stage1-batch-${{ matrix.batch_index }}
          path: extension/artifacts/protocol002/stage1_batches/*.json
          if-no-files-found: error
