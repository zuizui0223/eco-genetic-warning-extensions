name: Dynamic partner architecture Phase T

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          python -m pytest -q tests/test_dynamic_partner_architecture_phase_t.py

  seed-block:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        master_seed: [20290610, 20290611, 20290612, 20290613, 20290614]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: extension
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e upstream
          python -m pip install -e extension
      - working-directory: extension
        run: |
          mkdir -p artifacts/dynamic_partner_architecture/seeds
          python scripts/run_dynamic_partner_architecture_phase_t_seed.py \
            --upstream-checkout ../upstream \
            --master-seed ${{ matrix.master_seed }} \
            --output artifacts/dynamic_partner_architecture/seeds/seed_${{ matrix.master_seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase-t-seed-${{ matrix.master_seed }}
          path: extension/artifacts/dynamic_partner_architecture/seeds/seed_${{ matrix.master_seed }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: seed-block
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase-t-seed-*
          path: artifacts/dynamic_partner_architecture/seeds
          merge-multiple: true
      - run: |
          python scripts/aggregate_dynamic_partner_architecture_phase_t.py \
            --input-glob 'artifacts/dynamic_partner_architecture/seeds/seed_*.json' \
            --output artifacts/dynamic_partner_architecture/phase_t_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-partner-architecture-phase-t
          path: artifacts/dynamic_partner_architecture/phase_t_summary.json
          if-no-files-found: error
          retention-days: 90
