name: Protocol 002 publication outputs

on:
  pull_request:
    branches: [main]
    paths:
      - "src/eco_genetic_warning_extensions/protocol002_publication_outputs.py"
      - "scripts/build_protocol002_publication_outputs.py"
      - "tests/test_protocol002_publication_outputs.py"
      - "docs/PROTOCOL_003_STAGE3_OPTIONS.md"
      - ".github/workflows/protocol-002-publication-outputs.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-publication-outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      AUDIT_RUN_ID: "29253066194"
    steps:
      - name: Checkout extension repo
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install extension and test tools
        run: python -m pip install -e . pytest
      - name: Run publication output tests
        run: python -m pytest -q tests/test_protocol002_publication_outputs.py
      - name: Download completed Stage II audit
        run: |
          mkdir -p collected
          gh run download "$AUDIT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name protocol002-stage2-no-domain-audit --dir collected
          test -f collected/stage2_no_domain_audit.json
      - name: Build publication CSV and SVG
        run: |
          python scripts/build_protocol002_publication_outputs.py \
            --audit collected/stage2_no_domain_audit.json \
            --csv artifacts/protocol002/publication/stage2_coordinate_regimes.csv \
            --svg artifacts/protocol002/publication/figure_stage2_coordinate_regimes.svg
      - name: Upload publication outputs
        uses: actions/upload-artifact@v4
        with:
          name: protocol002-publication-outputs
          path: artifacts/protocol002/publication
          if-no-files-found: error
          retention-days: 90
