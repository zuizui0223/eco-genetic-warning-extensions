name: Apply second-review figure patch

on:
  push:
    branches: [agent/address-identification-review]
    paths:
      - 'scripts/apply_review_v2_figure_patch.py'
      - '.github/workflows/apply-review-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/address-identification-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic Figure 6 edits
        run: python scripts/apply_review_v2_figure_patch.py
      - name: Verify figure code and manuscript constraints
        run: |
          python -m py_compile src/eco_genetic_warning_extensions/publication_figures.py
          grep -q '150.0' src/eco_genetic_warning_extensions/publication_figures.py
          grep -q 'all six horizon-normalized 95% intervals include 0' src/eco_genetic_warning_extensions/publication_figures.py
          python scripts/check_ecology_letters_compliance.py
      - name: Commit patched figure generator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/eco_genetic_warning_extensions/publication_figures.py
          if git diff --cached --quiet; then
            echo 'No figure changes to commit.'
          else
            git commit -m 'Apply second-review Figure 6 edits [skip ci]'
            git push origin HEAD:agent/address-identification-review
          fi
