name: Campanula effective-interaction schema discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install schema dependency
        run: python -m pip install --upgrade openpyxl

      - name: Inspect locked workbook schema only
        run: |
          python scripts/fetch_campanula_effective_interaction_schema.py \
            --output artifacts/empirical/campanula_effective_interaction_schema.json

      - name: Validate locked schema boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('artifacts/empirical/campanula_effective_interaction_schema.json').read_text(encoding='utf-8'))
          assert d['status'] == 'schema_only_discovery_complete'
          assert d['source_lock']['observed_md5'] == '2d26307743e8a22384781854b8f2f33b'
          assert d['source_lock']['sha256'] == 'b81b77248b75330049e1ddd8ae026db127f838e979620a0415a5addb9a7e8f27'
          assert d['workbook']['sheet_names'] == [
              'PopVis Rates_ PL_Depletion',
              'Grains To Seeds ',
              'Pollen Deposition Efficiency',
              'Seed Set Efficiency',
              'Pollen Removal Efficiency',
              'Metadata',
          ]
          assert 'Numeric study-cell values were not copied' in d['inspection_boundary']
          print(json.dumps({'status': 'effective_interaction_state_identifiable'}, sort_keys=True))
          PY

      - name: Upload schema manifest only
        uses: actions/upload-artifact@v4
        with:
          name: campanula-effective-interaction-schema
          path: artifacts/empirical/campanula_effective_interaction_schema.json
          if-no-files-found: error
          retention-days: 30
