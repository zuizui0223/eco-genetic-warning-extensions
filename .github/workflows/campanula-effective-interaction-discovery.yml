name: Campanula effective-interaction schema discovery

on:
  pull_request:
    paths:
      - 'manuscript/empirical_campanula_effective_interaction_preregistration.md'
      - 'scripts/fetch_campanula_effective_interaction_schema.py'
      - 'tests/test_campanula_effective_interaction_discovery_contract.py'
      - '.github/workflows/campanula-effective-interaction-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install schema dependency
        run: python -m pip install --upgrade openpyxl

      - name: Inspect locked workbook schema only
        run: |
          python scripts/fetch_campanula_effective_interaction_schema.py \
            --output artifacts/empirical/campanula_effective_interaction_schema.json

      - name: Validate schema-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('artifacts/empirical/campanula_effective_interaction_schema.json').read_text(encoding='utf-8'))
          assert d['status'] == 'schema_only_discovery_complete'
          assert d['source_lock']['zenodo_record'] == 4969330
          assert d['source_lock']['dryad_doi'] == '10.5061/dryad.5nj81nf'
          assert d['source_lock']['observed_md5'] == '2d26307743e8a22384781854b8f2f33b'
          assert d['workbook']['sheet_count'] >= 4
          assert 'Numeric study-cell values were not copied' in d['inspection_boundary']
          assert 'second exact-model preregistration' in d['next_gate']
          print(json.dumps({
              'sheets': d['workbook']['sheet_names'],
              'sha256': d['source_lock']['sha256'],
              'keyword_hits': {
                  sheet['sheet']: sheet['label_keyword_hits']
                  for sheet in d['workbook']['sheets']
              },
          }, sort_keys=True))
          PY

      - name: Upload schema manifest only
        uses: actions/upload-artifact@v4
        with:
          name: campanula-effective-interaction-schema
          path: artifacts/empirical/campanula_effective_interaction_schema.json
          if-no-files-found: error
          retention-days: 30
