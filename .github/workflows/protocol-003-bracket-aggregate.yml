name: Protocol 003 bracket aggregation

on:
  pull_request:
    paths:
      - 'src/eco_genetic_warning_extensions/protocol003_bracket_aggregate.py'
      - 'scripts/aggregate_protocol003_bracket_pilot.py'
      - '.github/workflows/protocol-003-bracket-aggregate.yml'
      - 'tests/test_protocol003_bracket_aggregate.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extension
        run: python -m pip install -e .

      - name: Download completed bracket artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded
          gh run download 29399936075 --repo "${{ github.repository }}" --dir downloaded

      - name: Aggregate blind bracket pilot
        run: |
          python scripts/aggregate_protocol003_bracket_pilot.py \
            downloaded \
            artifacts/protocol003/bracket_pilot_aggregation.json

      - name: Upload aggregation
        uses: actions/upload-artifact@v4
        with:
          name: protocol003-bracket-pilot-aggregation
          path: artifacts/protocol003/bracket_pilot_aggregation.json
