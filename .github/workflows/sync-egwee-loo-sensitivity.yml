name: Sync EGWEE LOO sensitivity

on:
  push:
    branches:
      - fix/sync-egwee-loo-sensitivity
    paths:
      - '.github/workflows/sync-egwee-loo-sensitivity.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sync-egwee-loo-sensitivity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply LOO sensitivity sync
        run: python scripts/sync_egwee_loo_sensitivity.py
      - name: Validate flagship compliance
        run: python scripts/check_nee_flagship_compliance.py
      - name: Commit synchronized surfaces
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/nee_flagship_source_manifest.json manuscript/nee_flagship_article.md manuscript/nee_flagship_submission_metadata.md manuscript/nee_flagship_cover_letter.md scripts/check_nee_flagship_compliance.py
          git diff --cached --check
          git commit -m 'Sync EGWEE influential-cluster sensitivity into NEE'
          git push origin HEAD:fix/sync-egwee-loo-sensitivity
