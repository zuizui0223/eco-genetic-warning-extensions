name: Cross-layer alignment Phase V

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/eco_genetic_warning_extensions/cross_layer_alignment_phase_v.py'
      - 'src/eco_genetic_warning_extensions/cross_layer_alignment_phase_v_runner.py'
      - 'scripts/run_cross_layer_alignment_phase_v.py'
      - 'tests/test_cross_layer_alignment_phase_v.py'
      - 'docs/CROSS_LAYER_ALIGNMENT_PHASE_V_PROTOCOL.md'
      - '.github/workflows/cross-layer-alignment-phase-v.yml'

permissions:
  contents: read

jobs:
  run-phase-v:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
      - name: Checkout exact parent scientific commit
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned parent and extension
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e upstream
          python -m pip install -e .
      - name: Validate preregistration contract
        run: python -m pytest -q tests/test_cross_layer_alignment_phase_v.py
      - name: Run paired Phase V campaign
        run: python scripts/run_cross_layer_alignment_phase_v.py --output artifacts/cross_layer_alignment/phase_v_summary.json
      - name: Validate scientific output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/cross_layer_alignment/phase_v_summary.json')
          data=json.loads(p.read_text())
          assert data['upstream_scientific_commit']=='dd8ee379d0d3518194c767d16402042525bc00dc'
          assert data['manifest']['warning_blind'] is True
          assert data['mechanistic_certificate']['coarse_marginal_signatures_identical'] is True
          assert data['mechanistic_certificate']['coarse_marginals_are_transition_sufficient'] is False
          assert data['paired_summary']['comparable_pairs']==500
          assert [row['attempted'] for row in data['condition_summaries']]==[500,500]
          assert data['decision'] in {
              'cross_layer_alignment_changes_functional_loss_incidence',
              'coarse_marginals_not_transition_sufficient_but_no_detected_loss_incidence_effect',
          }
          print(json.dumps({
              'decision': data['decision'],
              'certificate': data['mechanistic_certificate'],
              'conditions': data['condition_summaries'],
              'paired': data['paired_summary'],
          }, indent=2))
          PY
      - name: Upload locked scientific output
        uses: actions/upload-artifact@v4
        with:
          name: cross-layer-alignment-phase-v
          path: artifacts/cross_layer_alignment/phase_v_summary.json
          if-no-files-found: error
