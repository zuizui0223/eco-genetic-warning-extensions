name: Fresh connectivity replication Phase U

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/eco_genetic_warning_extensions/fresh_connectivity_replication_phase_u.py"
      - "src/eco_genetic_warning_extensions/fresh_connectivity_replication_phase_u_runner.py"
      - "scripts/run_fresh_connectivity_replication_phase_u_seed.py"
      - "scripts/aggregate_fresh_connectivity_replication_phase_u.py"
      - "tests/test_fresh_connectivity_replication_phase_u.py"
      - "docs/FRESH_CONNECTIVITY_REPLICATION_PHASE_U.md"
      - ".github/workflows/fresh-connectivity-replication-phase-u.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          python -m pytest -q tests/test_fresh_connectivity_replication_phase_u.py

  seed-block:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        master_seed: [20291010, 20291011, 20291012, 20291013, 20291014]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: extension
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e upstream
          python -m pip install -e extension
      - working-directory: extension
        run: |
          mkdir -p artifacts/fresh_connectivity_replication/seeds
          python scripts/run_fresh_connectivity_replication_phase_u_seed.py \
            --upstream-checkout ../upstream \
            --master-seed ${{ matrix.master_seed }} \
            --output artifacts/fresh_connectivity_replication/seeds/seed_${{ matrix.master_seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase-u-seed-${{ matrix.master_seed }}
          path: extension/artifacts/fresh_connectivity_replication/seeds/seed_${{ matrix.master_seed }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: seed-block
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase-u-seed-*
          path: artifacts/fresh_connectivity_replication/seeds
          merge-multiple: true
      - run: |
          python scripts/aggregate_fresh_connectivity_replication_phase_u.py \
            --input-glob 'artifacts/fresh_connectivity_replication/seeds/seed_*.json' \
            --output artifacts/fresh_connectivity_replication/phase_u_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-connectivity-replication-phase-u
          path: artifacts/fresh_connectivity_replication/phase_u_summary.json
          if-no-files-found: error
          retention-days: 90
