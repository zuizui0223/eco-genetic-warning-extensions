name: Toronto residual-context replication

on:
  push:
    branches:
      - agent/run-schema-v2-recognized
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile response-firewalled Mallorca schema auditors
        run: |
          python -m py_compile scripts/audit_mallorca_network_schema_v2.py
          python -m py_compile scripts/audit_mallorca_original_dryad_schema.py
      - name: Run later-representation Mallorca schema audit
        run: python scripts/audit_mallorca_network_schema_v2.py --output artifacts/empirical/n3_mallorca_network_schema_audit_v2.json
      - name: Audit original Mallorca Dryad workbook and notes without numeric outcome inspection
        run: python scripts/audit_mallorca_original_dryad_schema.py --output artifacts/empirical/n3_mallorca_original_dryad_schema.json
      - name: Validate Stage-A diagnostic decision space
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          later = json.loads(Path('artifacts/empirical/n3_mallorca_network_schema_audit_v2.json').read_text())
          original = json.loads(Path('artifacts/empirical/n3_mallorca_original_dryad_schema.json').read_text())
          assert later['decision'] in {
              'species_year_alignment_demonstrated',
              'species_year_alignment_not_yet_demonstrated',
              'schema_audit_error',
          }, later
          assert original['decision'] in {
              'schema_documented_for_manual_gate_review',
              'required_files_missing',
              'schema_audit_error',
          }, original
          print(json.dumps({
              'later_representation_decision': later['decision'],
              'missing_species': {y: later.get('alignment', {}).get(y, {}).get('missing_dataset_species') for y in ('2016', '2017')},
              'original_archive_decision': original['decision'],
              'original_archive_schema_signals': original.get('schema_signals'),
              'original_archive_sheetnames': original.get('workbook', {}).get('sheetnames'),
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mallorca-stage-a-diagnostics
          path: |
            artifacts/empirical/n3_mallorca_network_schema_audit_v2.json
            artifacts/empirical/n3_mallorca_original_dryad_schema.json
          if-no-files-found: error
          retention-days: 30
