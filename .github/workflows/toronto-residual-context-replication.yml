name: Toronto residual-context replication

on:
  push:
    branches:
      - agent/run-schema-v2-recognized
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile exact carob Stage-A gate
        run: python -m py_compile scripts/audit_carob_fit_ready_gate.py
      - name: Run exact response-firewalled carob fit-ready gate
        run: python scripts/audit_carob_fit_ready_gate.py --output artifacts/empirical/n3_carob_fit_ready_stage_a.json
      - name: Validate Stage-A decision space
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path('artifacts/empirical/n3_carob_fit_ready_stage_a.json').read_text())
          assert x['decision'] in {'fit_ready_stage_a', 'not_fit_ready_stage_a', 'stage_a_audit_error'}, x
          if x['decision'] == 'fit_ready_stage_a':
              assert all(x['gate_conditions'].values()), x
              assert x['fruit_sheet']['orchard_count'] >= 10
          print(json.dumps(x, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: carob-fit-ready-stage-a
          path: artifacts/empirical/n3_carob_fit_ready_stage_a.json
          if-no-files-found: error
          retention-days: 30
