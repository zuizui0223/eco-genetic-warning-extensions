name: Toronto residual-context replication

on:
  push:
    branches:
      - agent/run-n3-carob-frozen
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen carob analysis dependencies
        run: python -m pip install pytest pandas numpy scipy statsmodels openpyxl
      - name: Verify preregistration guards
        run: python -m pytest tests/test_n3_carob_predictive_contract.py tests/test_n3_carob_predictive_implementation_static.py
      - name: Compile frozen carob analysis
        run: python -m py_compile scripts/run_n3_carob_predictive.py
      - name: Run one-shot preregistered carob predictive test
        run: python scripts/run_n3_carob_predictive.py --output artifacts/empirical/n3_carob_predictive_result.json
      - name: Validate frozen decision space
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path('artifacts/empirical/n3_carob_predictive_result.json').read_text())
          allowed = {
              'primary_model_not_identifiable',
              'process_primary_model_not_identifiable',
              'process_measurement_not_supported_for_primary_endpoint',
              'process_representation_sensitive',
              'context_primary_model_not_identifiable',
              'context_predictively_redundant_given_partial_process_state',
              'residual_context_required',
              'residual_context_representation_sensitive',
          }
          assert x['decision'] in allowed, x
          assert 'contract_sha256' in x
          assert 'response_firewall' in x
          if 'data_audit' in x:
              assert x['data_audit']['orchard_count'] == 20
              assert x['data_audit']['orchard_year_rows'] == 37
          if x.get('B1_gate') == 'process_adequacy_supported_across_representations':
              assert x['B2_opened'] is True
          else:
              assert x.get('B2_opened') in {False, None}
          print(json.dumps(x, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: n3-carob-predictive-one-shot
          path: artifacts/empirical/n3_carob_predictive_result.json
          if-no-files-found: error
          retention-days: 30
