name: Toronto residual-context replication

on:
  push:
    branches:
      - agent/run-schema-v2-recognized
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen analysis and schema-audit dependencies
        run: python -m pip install pandas numpy scipy statsmodels openpyxl
      - name: Compile frozen and response-firewalled programs
        run: |
          python -m py_compile scripts/run_toronto_residual_context.py
          python -m py_compile scripts/run_toronto_residual_context_v2.py
          python -m py_compile scripts/audit_mallorca_network_schema_v2.py
          python -m py_compile scripts/audit_mallorca_original_dryad_schema.py
      - name: Run exact Toronto case-normalization repair and frozen LOGO analysis
        run: |
          python scripts/run_toronto_residual_context_v2.py \
            --output artifacts/empirical/toronto_residual_context_result_v2.json \
            --repair-audit artifacts/empirical/toronto_schema_repair_audit.json
      - name: Run semicolon-aware Mallorca later-representation schema audit
        run: python scripts/audit_mallorca_network_schema_v2.py --output artifacts/empirical/n3_mallorca_network_schema_audit_v2.json
      - name: Audit original Mallorca Dryad workbook and notes without numeric outcome inspection
        run: python scripts/audit_mallorca_original_dryad_schema.py --output artifacts/empirical/n3_mallorca_original_dryad_schema.json
      - name: Validate fixed decision space
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          toronto = json.loads(Path('artifacts/empirical/toronto_residual_context_result_v2.json').read_text())
          repair = json.loads(Path('artifacts/empirical/toronto_schema_repair_audit.json').read_text())
          mallorca = json.loads(Path('artifacts/empirical/n3_mallorca_network_schema_audit_v2.json').read_text())
          original = json.loads(Path('artifacts/empirical/n3_mallorca_original_dryad_schema.json').read_text())
          assert repair['repair']['repair'] == 'species_phytometer_case_only'
          assert repair['repair']['canonical_codes'] == ['DECA', 'LOSI', 'PEHI', 'SYNO']
          assert toronto['decision'] in {
              'primary_model_not_identifiable',
              'residual_urban_context_information_detected',
              'no_detected_residual_urban_context_information',
          }, toronto
          assert mallorca['decision'] in {
              'species_year_alignment_demonstrated',
              'species_year_alignment_not_yet_demonstrated',
              'schema_audit_error',
          }, mallorca
          assert original['decision'] in {
              'schema_documented_for_manual_gate_review',
              'required_files_missing',
              'schema_audit_error',
          }, original
          print(json.dumps({
              'toronto_decision': toronto['decision'],
              'toronto_delta_NLL_total': toronto.get('delta_NLL_total'),
              'toronto_bootstrap_95ci': toronto.get('garden_bootstrap_95ci'),
              'mallorca_later_representation_decision': mallorca['decision'],
              'mallorca_missing_species': {y: mallorca.get('alignment', {}).get(y, {}).get('missing_dataset_species') for y in ('2016', '2017')},
              'mallorca_original_decision': original['decision'],
              'mallorca_original_schema_signals': original.get('schema_signals'),
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: schema-v2-recognized-run
          path: |
            artifacts/empirical/toronto_residual_context_result_v2.json
            artifacts/empirical/toronto_schema_repair_audit.json
            artifacts/empirical/n3_mallorca_network_schema_audit_v2.json
            artifacts/empirical/n3_mallorca_original_dryad_schema.json
          if-no-files-found: error
          retention-days: 30
