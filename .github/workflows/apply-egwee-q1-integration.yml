name: Sync EGWEE Q1 submission surfaces

on:
  push:
    branches:
      - agent/integrate-egwee-natural-q1
    paths:
      - '.github/workflows/apply-egwee-q1-integration.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrate-egwee-natural-q1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize article, cover letter, metadata, and routers
        run: python scripts/sync_egwee_q1_submission_surfaces.py
      - name: Validate flagship compliance
        run: python scripts/check_nee_flagship_compliance.py
      - name: Commit synchronized surfaces
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md manuscript/README.md manuscript/PUBLICATION_LANES.md manuscript/EG_SERIES_SUBMISSION_STATUS_2026-09-08.md manuscript/nee_flagship_article.md manuscript/nee_flagship_cover_letter.md manuscript/nee_flagship_submission_metadata.md manuscript/nee_flagship_display_plan.md
          git diff --cached --check
          git commit -m 'Sync NEE submission surfaces to completed EGWEE Q1'
          git push origin HEAD:agent/integrate-egwee-natural-q1
