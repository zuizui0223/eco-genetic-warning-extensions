name: Protocol invariant CI

on:
  push:
    branches: [main, "feat/**", "paper/**", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Run protocol invariant tests
        run: python -m pytest
      - name: Compile package
        run: python -m compileall -q src
