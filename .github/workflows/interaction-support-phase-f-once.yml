name: Interaction support Phase F one-shot

on:
  push:
    branches: [agent/unify-paper-storyline]
    paths:
      - ".github/workflows/interaction-support-phase-f-once.yml"

permissions:
  contents: read

jobs:
  phase-f-once:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout extension repo
        uses: actions/checkout@v4
        with:
          path: extension
      - name: Checkout exact parent scientific commit
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e upstream
          python -m pip install -e extension
      - name: Verify preregistered contract
        working-directory: extension
        run: python -m pytest -q tests/test_interaction_support_phase_f.py
      - name: Run corrected interaction-support campaign
        working-directory: extension
        run: |
          mkdir -p artifacts/interaction_support
          python scripts/run_interaction_support_phase_f.py \
            --upstream-checkout ../upstream \
            --output artifacts/interaction_support/phase_f_full.json
      - name: Build and print compact summary
        working-directory: extension
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('artifacts/interaction_support/phase_f_full.json')
          artifact = json.loads(source.read_text())
          summary = {
              'stage': artifact['stage'],
              'calibration_scope': artifact['calibration_scope'],
              'manifest': artifact['manifest'],
              'interaction_support_summaries': artifact['interaction_support_summaries'],
          }
          out = Path('artifacts/interaction_support/phase_f_summary.json')
          out.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          for row in summary['interaction_support_summaries']:
              print(json.dumps(row, sort_keys=True))
          PY
      - name: Upload Phase-F artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warning-blind-interaction-support-phase-f-corrected
          path: |
            extension/artifacts/interaction_support/phase_f_full.json
            extension/artifacts/interaction_support/phase_f_summary.json
          if-no-files-found: error
          retention-days: 90
