name: Eschscholzia joint-state schema discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch fixed EIDC packages and inspect headers only
        run: |
          python scripts/fetch_eschscholzia_joint_state_schema.py \
            --manifest artifacts/empirical/eschscholzia_joint_state_schema.json

      - name: Validate schema-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('artifacts/empirical/eschscholzia_joint_state_schema.json').read_text(encoding='utf-8'))
          assert d['status'] == 'schema_only_discovery_complete'
          assert len(d['datasets']) == 4
          assert {x['role'] for x in d['datasets']} == {
              'pollinator_availability',
              'seed_function_supplemented_exposed',
              'seed_function_exposed_excluded',
              'paternity',
          }
          assert all(x['landing_sha256'] and x['payloads'] for x in d['datasets'])
          for dataset in d['datasets']:
              assert all(payload['package_sha256'] and payload['members'] for payload in dataset['payloads'])
              assert any(
                  'columns' in member
                  for payload in dataset['payloads']
                  for member in payload['members']
              )
          assert 'No data rows' in d['inspection_boundary']
          print(json.dumps({
              x['role']: [
                  {'url': p['resolved_url'], 'members': [m['member_name'] for m in p['members']]}
                  for p in x['payloads']
              ]
              for x in d['datasets']
          }, sort_keys=True))
          PY

      - name: Upload schema manifest only
        uses: actions/upload-artifact@v4
        with:
          name: eschscholzia-joint-state-schema
          path: artifacts/empirical/eschscholzia_joint_state_schema.json
          if-no-files-found: error
          retention-days: 30
