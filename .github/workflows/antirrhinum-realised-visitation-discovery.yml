name: Antirrhinum realised-visitation schema discovery

on:
  pull_request:
    paths:
      - 'manuscript/empirical_antirrhinum_realised_visitation_preregistration.md'
      - 'scripts/fetch_antirrhinum_realised_visitation_schema.py'
      - 'tests/test_antirrhinum_realised_visitation_discovery_contract.py'
      - '.github/workflows/antirrhinum-realised-visitation-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install schema dependencies
        run: python -m pip install --upgrade openpyxl xlrd

      - name: Resolve MD5-locked ISTA archives and inspect schema only
        run: |
          python scripts/fetch_antirrhinum_realised_visitation_schema.py \
            --manifest artifacts/empirical/antirrhinum_realised_visitation_schema.json

      - name: Validate schema-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('artifacts/empirical/antirrhinum_realised_visitation_schema.json').read_text(encoding='utf-8'))
          assert d['status'] == 'schema_only_discovery_complete'
          assert {r['doi'] for r in d['records']} == {'10.15479/AT:ISTA:36', '10.15479/AT:ISTA:37'}
          expected = {
              'wild_visitation': 'cbc61b523d4d475a04a737d50dc470ef',
              'wild_paternity_2012': '4ae751b1fa4897fa216241f975a57313',
          }
          for row in d['records']:
              assert row['observed_md5'] == expected[row['role']]
              assert row['members']
          assert 'No data-row value' in d['inspection_boundary']
          print(json.dumps({r['role']: [m['member_name'] for m in r['members']] for r in d['records']}, sort_keys=True))
          PY

      - name: Upload schema manifest only
        uses: actions/upload-artifact@v4
        with:
          name: antirrhinum-realised-visitation-schema
          path: artifacts/empirical/antirrhinum_realised_visitation_schema.json
          if-no-files-found: error
          retention-days: 30
