name: Warning-blind R4 width refinement Phase D

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/WARNING_BLIND_R4_WIDTH_PHASE_D.md"
      - "src/eco_genetic_warning_extensions/frontier_refinement_manifest.py"
      - "src/eco_genetic_warning_extensions/r4_width_phase_d_runner.py"
      - "scripts/run_r4_width_phase_d.py"
      - "tests/test_r4_width_phase_d_manifest.py"
      - ".github/workflows/r4-width-phase-d.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-d:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout extension repo
        uses: actions/checkout@v4
        with:
          path: extension
      - name: Checkout exact parent scientific commit
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages and test runner
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e upstream
          python -m pip install -e extension
      - name: Verify locked Phase-D manifest
        working-directory: extension
        run: python -m pytest -q tests/test_r4_width_phase_d_manifest.py
      - name: Run three high-rep warning-blind Phase-D cells
        working-directory: extension
        run: |
          mkdir -p artifacts/frontier_refinement/phase_d
          for i in $(seq 0 2); do
            python scripts/run_r4_width_phase_d.py \
              --upstream-checkout ../upstream \
              --cell-index "$i" \
              --output "artifacts/frontier_refinement/phase_d/cell_${i}.json"
          done
      - name: Aggregate Phase-D width result
        working-directory: extension
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('artifacts/frontier_refinement/phase_d').glob('cell_*.json')):
              a=json.loads(p.read_text())
              assert a['calibration_scope'] == 'trait_loss_only'
              rows.append({
                  **a['cell'],
                  'regime':a['regime'],
                  'pooled_trait_loss_rate':a['pooled_trait_loss_rate'],
                  'seed_rates':[b['trait_loss_rate'] for b in a['seed_blocks']],
                  'baseline_eligible_by_seed':[b['baseline_eligible_count'] for b in a['seed_blocks']],
                  'seed_rate_range':a['seed_rate_range'],
                  'highrep_support_sufficient':a['highrep_support_sufficient'],
                  'status_counts':a['status_counts'],
              })
          r4=[row['p_star'] for row in rows if row['regime']=='R4_highrep']
          summary={
              'stage':'warning-blind R4 width refinement Phase D summary',
              'calibration_scope':'trait_loss_only',
              'cell_count':len(rows),
              'r4_p_star_values':r4,
              'cells':rows,
          }
          out=Path('artifacts/frontier_refinement/phase_d_summary.json')
          out.write_text(json.dumps(summary, indent=2, sort_keys=True)+'\n')
          for row in rows:
              print(row)
          print('R4:', r4)
          PY
      - name: Upload Phase-D artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warning-blind-r4-width-phase-d
          path: |
            extension/artifacts/frontier_refinement/phase_d/*.json
            extension/artifacts/frontier_refinement/phase_d_summary.json
          if-no-files-found: error
          retention-days: 90
