name: Fresh fixed-domain warning replication Phase V

on:
  workflow_dispatch:

# Phase V scientific run #1 (32636847803) is the locked preregistered evidence.
# This workflow is manual-only after result lock so ordinary manuscript/test edits
# cannot generate replacement scientific ensembles.

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest tests/test_fresh_warning_replication_phase_v_current.py -q

  scientific:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
      - name: Checkout pinned parent
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e upstream
      - run: python -m pip install -e .
      - name: Run one preregistered fresh ensemble
        run: python scripts/run_fresh_warning_replication_phase_v.py
      - name: Verify outputs
        run: |
          test -f artifacts/fresh_warning_replication/phase_v_manifest.json
          test -f artifacts/fresh_warning_replication/phase_v_raw.json
          test -f artifacts/fresh_warning_replication/phase_v_summary.json
      - name: Upload Phase V evidence
        uses: actions/upload-artifact@v4
        with:
          name: fresh-warning-replication-phase-v
          path: artifacts/fresh_warning_replication/
          if-no-files-found: error
          retention-days: 90
