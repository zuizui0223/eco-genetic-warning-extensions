name: Protocol 003 independent calibration

on:
  pull_request:
    paths:
      - 'src/eco_genetic_warning_extensions/protocol003_calibration.py'
      - 'scripts/run_protocol003_calibration_cell.py'
      - 'tests/test_protocol003_calibration.py'
      - '.github/workflows/protocol-003-calibration.yml'
      - 'docs/PROTOCOL_003_AMENDMENT_001.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-cell:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cell_index: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4

      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extension
        run: python -m pip install -e .

      - name: Check locked calibration design
        run: python -m pytest -q tests/test_protocol003_calibration.py

      - name: Run trait-loss-only calibration cell
        run: |
          python scripts/run_protocol003_calibration_cell.py \
            upstream \
            "${{ matrix.cell_index }}" \
            "artifacts/protocol003/calibration_cell_${{ matrix.cell_index }}.json"

      - name: Upload calibration artifact
        uses: actions/upload-artifact@v4
        with:
          name: protocol003-calibration-cell-${{ matrix.cell_index }}
          path: artifacts/protocol003/calibration_cell_${{ matrix.cell_index }}.json
