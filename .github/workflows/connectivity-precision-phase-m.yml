name: Connectivity precision validation Phase M

on:
  pull_request:
    branches:
      - "agent/headline-r3-validity-phase-l"
    paths:
      - "src/eco_genetic_warning_extensions/connectivity_precision_phase_m.py"
      - "src/eco_genetic_warning_extensions/connectivity_precision_phase_m_runner.py"
      - "scripts/run_connectivity_precision_phase_m_seed.py"
      - "scripts/aggregate_connectivity_precision_phase_m.py"
      - "tests/test_connectivity_precision_phase_m.py"
      - "docs/CONNECTIVITY_PRECISION_PHASE_M.md"
      - ".github/workflows/connectivity-precision-phase-m.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          python -m pytest -q tests/test_connectivity_precision_phase_m.py

  seed-block:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        master_seed: [20290410, 20290411, 20290412, 20290413, 20290414]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: extension
      - name: Checkout exact parent scientific commit
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e upstream
          python -m pip install -e extension
      - name: Run one locked master seed at 100 replicates across all migration rates
        working-directory: extension
        run: |
          mkdir -p artifacts/connectivity_precision
          python scripts/run_connectivity_precision_phase_m_seed.py \
            --upstream-checkout ../upstream \
            --master-seed ${{ matrix.master_seed }} \
            --output artifacts/connectivity_precision/seed_${{ matrix.master_seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase-m-seed-${{ matrix.master_seed }}
          path: extension/artifacts/connectivity_precision/seed_${{ matrix.master_seed }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: seed-block
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase-m-seed-*
          path: artifacts/connectivity_precision/seeds
          merge-multiple: true
      - name: Aggregate connectivity precision result
        run: |
          python scripts/aggregate_connectivity_precision_phase_m.py \
            --input-glob 'artifacts/connectivity_precision/seeds/seed_*.json' \
            --output artifacts/connectivity_precision/phase_m_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: connectivity-precision-phase-m
          path: artifacts/connectivity_precision/phase_m_summary.json
          if-no-files-found: error
          retention-days: 90
