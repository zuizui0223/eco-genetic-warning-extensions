name: Protocol 002 Stage I projection pilot

on:
  workflow_dispatch:
  push:
    branches: ["feat/protocol-002-stage1-projection-pilot"]
    paths:
      - "src/eco_genetic_warning_extensions/protocol002_stage1_projection_pilot.py"
      - "scripts/run_protocol002_stage1_projection_pilot.py"
      - "tests/test_protocol002_stage1_projection_pilot.py"
      - ".github/workflows/protocol-002-stage1-projection-pilot.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stage1-projection-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout extension repo
        uses: actions/checkout@v4
        with:
          path: extension
      - name: Checkout pinned upstream repo
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install extension
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e extension
      - name: Run contract test
        working-directory: extension
        run: python -m pytest -q tests/test_protocol002_stage1_projection_pilot.py
      - name: Run Stage I source preparation and projection pilot
        working-directory: extension
        run: |
          python scripts/run_protocol002_stage1_projection_pilot.py \
            --upstream-checkout ../upstream \
            --output artifacts/protocol002/stage1_source_projection_pilot.json
      - name: Show pilot artifact
        working-directory: extension
        run: cat artifacts/protocol002/stage1_source_projection_pilot.json
      - name: Upload pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: protocol002-stage1-source-projection-pilot
          path: extension/artifacts/protocol002/stage1_source_projection_pilot.json
          if-no-files-found: error
