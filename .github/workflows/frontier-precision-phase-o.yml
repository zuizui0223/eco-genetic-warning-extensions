name: Frontier precision validation Phase O

on:
  pull_request:
    branches:
      - "agent/headline-r3-validity-phase-l"
    paths:
      - "src/eco_genetic_warning_extensions/frontier_precision_phase_o.py"
      - "src/eco_genetic_warning_extensions/frontier_precision_phase_o_runner.py"
      - "scripts/run_frontier_precision_phase_o_seed.py"
      - "scripts/aggregate_frontier_precision_phase_o.py"
      - "tests/test_frontier_precision_phase_o.py"
      - "docs/FRONTIER_PRECISION_PHASE_O.md"
      - ".github/workflows/frontier-precision-phase-o.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          python -m pytest -q tests/test_frontier_precision_phase_o.py
  seed-block:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        master_seed: [20290310,20290311,20290312,20290313,20290314]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {path: extension}
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: upstream
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e upstream
          python -m pip install -e extension
      - working-directory: extension
        run: |
          mkdir -p artifacts/frontier_precision
          python scripts/run_frontier_precision_phase_o_seed.py --upstream-checkout ../upstream --master-seed ${{ matrix.master_seed }} --output artifacts/frontier_precision/seed_${{ matrix.master_seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase-o-seed-${{ matrix.master_seed }}
          path: extension/artifacts/frontier_precision/seed_${{ matrix.master_seed }}.json
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: seed-block
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: phase-o-seed-*
          path: artifacts/frontier_precision/seeds
          merge-multiple: true
      - run: python scripts/aggregate_frontier_precision_phase_o.py --input-glob 'artifacts/frontier_precision/seeds/seed_*.json' --output artifacts/frontier_precision/phase_o_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-precision-phase-o
          path: artifacts/frontier_precision/phase_o_summary.json
          if-no-files-found: error
          retention-days: 90
