name: Record NEE AI policy gate

on:
  push:
    branches:
      - chore/nee-ai-policy-hard-stop
    paths:
      - '.github/workflows/record-nee-ai-policy-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/nee-ai-policy-hard-stop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/record_nee_ai_policy_gate.py
      - run: python scripts/check_nee_flagship_compliance.py
      - name: Commit policy-gate metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/nee_flagship_submission_metadata.md manuscript/submission_checklist.md
          git diff --cached --check
          git commit -m 'Record unresolved NEE AI policy gate'
          git push origin HEAD:chore/nee-ai-policy-hard-stop
