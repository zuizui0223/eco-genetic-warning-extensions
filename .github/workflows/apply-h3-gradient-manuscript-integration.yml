name: Apply H3 gradient manuscript integration

on:
  push:
    branches: [agent/address-identification-review]
    paths:
      - "scripts/apply_h3_gradient_manuscript_integration.py"
      - ".github/workflows/apply-h3-gradient-manuscript-integration.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/address-identification-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic manuscript integration
        run: python scripts/apply_h3_gradient_manuscript_integration.py
      - name: Validate manuscript contract
        run: |
          python -m pip install -e '.[dev]'
          python scripts/check_ecology_letters_compliance.py
          cmp manuscript/main_text.md manuscript/supervisor_first_draft.md
          grep -q '1,037/1,037' manuscript/main_text.md
          grep -q 'Supplementary Fig. S1' manuscript/main_text.md
          grep -q '31937210601' manuscript/supplementary_methods.md
          grep -q '9261157020' manuscript/artifact_index.md
          grep -q 'Supplementary Figure S1' manuscript/claim_evidence_map.md
      - name: Run manuscript contracts
        run: python -m pytest -q tests/test_integrated_manuscript_contract.py tests/test_figure_callout_contract.py
      - name: Commit integrated manuscript files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/main_text.md manuscript/supervisor_first_draft.md manuscript/supplementary_methods.md manuscript/claim_evidence_map.md manuscript/artifact_index.md manuscript/main_vs_supplement.md
          if git diff --cached --quiet; then
            echo 'No manuscript changes to commit.'
          else
            git commit -m 'Integrate H3 fragmentation-gradient sensitivity [skip ci]'
            git push origin HEAD:agent/address-identification-review
          fi
