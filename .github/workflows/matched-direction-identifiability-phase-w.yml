name: Matched direction identifiability Phase W

on:
  pull_request:
    paths:
      - "src/eco_genetic_warning_extensions/matched_direction_identifiability_phase_w.py"
      - "artifacts/matched_direction_identifiability/phase_w_locked_audit.json"
      - "docs/MATCHED_DIRECTION_IDENTIFIABILITY_PHASE_W.md"
      - "tests/test_matched_direction_identifiability_phase_w.py"
      - ".github/workflows/matched-direction-identifiability-phase-w.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest tests/test_matched_direction_identifiability_phase_w.py -q
      - name: Verify locked decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/matched_direction_identifiability/phase_w_locked_audit.json')
          d = json.loads(p.read_text())
          assert d['simulation_added'] is False
          assert d['warning_outcomes_inspected'] is False
          assert d['direction_only_warning_comparison_opened'] is False
          assert d['decision'] == 'direction_only_warning_comparison_not_identifiable_under_frozen_common_schedule'
          assert [row['pooled_loss'] for row in d['same_strength_cells']] == [1.0, 1.0, 0.4, 0.0, 0.0]
          PY
