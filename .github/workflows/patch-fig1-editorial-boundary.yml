name: Patch Figure 1 editorial boundary

on:
  push:
    branches:
      - edit/final-title-abstract-fig1
    paths:
      - '.github/workflows/patch-fig1-editorial-boundary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit/final-title-abstract-fig1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_fig1_editorial_boundary.py
      - run: python scripts/check_nee_flagship_compliance.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_nee_sorting_buffering_figures.py
          git diff --cached --check
          git commit -m 'Align Figure 1 with current evidence boundary'
          git push origin HEAD:edit/final-title-abstract-fig1
