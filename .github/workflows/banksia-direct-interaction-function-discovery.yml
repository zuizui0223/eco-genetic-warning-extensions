name: Banksia direct-interaction function schema discovery

on:
  pull_request:
    paths:
      - 'manuscript/empirical_banksia_direct_interaction_function_preregistration.md'
      - 'scripts/fetch_banksia_direct_interaction_function_schema.py'
      - 'tests/test_banksia_direct_interaction_function_discovery_contract.py'
      - '.github/workflows/banksia-direct-interaction-function-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install schema dependencies
        run: python -m pip install --upgrade openpyxl xlrd

      - name: Fetch fixed third-party GitHub snapshot and inspect schema only
        run: |
          python scripts/fetch_banksia_direct_interaction_function_schema.py \
            --manifest artifacts/empirical/banksia_direct_interaction_function_schema.json

      - name: Validate fixed snapshot and schema-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('artifacts/empirical/banksia_direct_interaction_function_schema.json').read_text(encoding='utf-8'))
          assert d['status'] == 'schema_only_discovery_complete'
          assert d['publication_doi'] == '10.1093/botlinnean/boae024'
          assert d['source_repository'] == 'stanwawrzyczek/Pollination-of-Banksia-catoglypta-Data'
          assert d['source_commit'] == '1ab685d62d005865935435bbd49cadba50080741'
          assert d['source_git_blob_sha'] == '91cc21eb4d967b702bd18f87f91be1b52cacb6a3'
          assert d['observed_git_blob_sha'] == d['source_git_blob_sha']
          assert d['members']
          assert 'No data-row value' in d['inspection_boundary']
          print(json.dumps({
              'zip_sha256': d['zip_sha256'],
              'members': [m['member_name'] for m in d['members']],
          }, sort_keys=True))
          PY

      - name: Upload schema manifest only
        uses: actions/upload-artifact@v4
        with:
          name: banksia-direct-interaction-function-schema
          path: artifacts/empirical/banksia_direct_interaction_function_schema.json
          if-no-files-found: error
          retention-days: 30
