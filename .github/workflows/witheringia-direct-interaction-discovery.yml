name: Witheringia direct-interaction schema discovery

on:
  pull_request:
    paths:
      - 'manuscript/empirical_witheringia_direct_interaction_preregistration.md'
      - 'scripts/fetch_witheringia_direct_interaction_schema.py'
      - 'tests/test_witheringia_direct_interaction_discovery_contract.py'
      - '.github/workflows/witheringia-direct-interaction-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workbook schema dependencies
        run: python -m pip install --upgrade openpyxl xlrd

      - name: Fetch locked Dryad files and inspect schema only
        run: |
          python scripts/fetch_witheringia_direct_interaction_schema.py \
            --manifest artifacts/empirical/witheringia_direct_interaction_schema.json

      - name: Validate schema-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('artifacts/empirical/witheringia_direct_interaction_schema.json').read_text(encoding='utf-8'))
          assert d['status'] == 'schema_only_discovery_complete'
          assert d['dataset_doi'] == '10.5061/dryad.f8539'
          expected = {
              'pollinators_all.xls',
              'FruitSet.xlsx',
              'paternity.xlsx',
              'abortion_data_2011.xlsx',
          }
          assert {row['filename'] for row in d['files']} == expected
          assert all(row['sha256'] and row['workbook_schema'] for row in d['files'])
          assert 'No data row' in d['inspection_boundary']
          print(json.dumps({row['filename']: [s['columns'] for s in row['workbook_schema']] for row in d['files']}, sort_keys=True))
          PY

      - name: Upload schema manifest only
        uses: actions/upload-artifact@v4
        with:
          name: witheringia-direct-interaction-schema
          path: artifacts/empirical/witheringia_direct_interaction_schema.json
          if-no-files-found: error
          retention-days: 30
