name: E3 Norway Dryad discovery

on:
  pull_request:
    paths:
      - 'scripts/fetch_e3_norway_dryad.py'
      - 'manuscript/empirical_e3_norway_preregistration.md'
      - '.github/workflows/e3-norway-dryad-discovery.yml'
      - 'tests/test_e3_norway_discovery_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workbook inspection dependencies
        run: python -m pip install --upgrade pandas openpyxl

      - name: Fetch locked Dryad archive and inventory schema
        run: |
          python scripts/fetch_e3_norway_dryad.py \
            --output-root _external/e3_norway_dryad \
            --manifest artifacts/empirical/e3_norway_dryad_discovery.json

      - name: Validate discovery contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/empirical/e3_norway_dryad_discovery.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['status'] == 'public_dryad_archive_discovered'
          assert d['resource_doi'] == '10.5061/dryad.d51c59zzj'
          assert d['source_files']
          assert any(f['name'].lower().endswith(('.xlsx','.xls')) for f in d['source_files'])
          print('files:', [f['name'] for f in d['source_files']])
          PY

      - name: Upload locked public-data snapshot
        uses: actions/upload-artifact@v4
        with:
          name: e3-norway-dryad-discovery
          path: |
            artifacts/empirical/e3_norway_dryad_discovery.json
            _external/e3_norway_dryad
          if-no-files-found: error
          retention-days: 30
