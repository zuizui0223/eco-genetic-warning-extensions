name: Apply three-message editorial hierarchy
on:
  push:
    branches: [editorial/three-message-hierarchy]
    paths: ['.github/workflows/apply-three-message-hierarchy.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/three-message-hierarchy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_three_message_hierarchy.py
      - run: python scripts/check_nee_flagship_compliance.py
      - name: Commit manuscript patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/nee_flagship_article.md
          git diff --cached --check
          git commit -m 'Sharpen three-message hierarchy in NEE flagship'
          git push origin HEAD:editorial/three-message-hierarchy
# rerun 2
