name: E2 Zurich EnviDat residual-context audit

on:
  pull_request:
    paths:
      - 'scripts/run_e2_zurich_residual_context.py'
      - 'manuscript/empirical_e2_zurich_residual_context_preregistration.md'
      - 'tests/test_e2_zurich_residual_context_contract.py'
      - '.github/workflows/e2-zurich-envidat-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4

      - name: Checkout locked BetterBlooms source
        uses: actions/checkout@v4
        with:
          repository: mrejichacko/BetterBlooms
          ref: d6361f6874398e797322afe07a8fea85a3c7e927
          path: _external/BetterBlooms

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install predictive-audit dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy statsmodels

      - name: Download locked EnviDat resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _external/envidat_download _external/envidat
          url='https://www.envidat.ch/dataset/d8e61f31-c2e5-4052-8784-b1624dfbfc40/resource/cef4a88c-0ef6-4327-a4a0-fc7d33b468e5/download/rejichacko_etal_2025_envidat.zip'
          curl --fail --location --retry 5 --retry-delay 3 --output _external/envidat_download/RejiChacko_etal_2025_EnviDat.zip "$url"
          unzip -t _external/envidat_download/RejiChacko_etal_2025_EnviDat.zip
          unzip -q _external/envidat_download/RejiChacko_etal_2025_EnviDat.zip -d _external/envidat
          sha256sum _external/envidat_download/RejiChacko_etal_2025_EnviDat.zip | tee _external/envidat_download/sha256.txt

      - name: Verify six declared reproductive endpoints
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            daucus_carota_seed_set.csv \
            raphanus_sativus_fruit_set.csv \
            raphanus_sativus_seed_set.csv \
            onobrychis_viciifolia_fruit_set.csv \
            symphytum_officinale_fruit_set.csv \
            symphytum_officinale_seed_set.csv; do
            count=$(find _external/envidat -type f -name "$f" | wc -l)
            test "$count" -eq 1 || { echo "expected exactly one $f, found $count"; exit 1; }
          done

      - name: Run preregistered leave-one-garden-out audit
        run: |
          python scripts/run_e2_zurich_residual_context.py \
            --betterblooms _external/BetterBlooms \
            --envidat-root _external/envidat \
            --output artifacts/empirical/e2_zurich_residual_context.json

      - name: Write source provenance manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          zip_path = Path('_external/envidat_download/RejiChacko_etal_2025_EnviDat.zip')
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          source_commit = subprocess.check_output(
              ['git', '-C', '_external/BetterBlooms', 'rev-parse', 'HEAD'], text=True
          ).strip()
          manifest = {
              'dataset_doi': '10.16904/envidat.676',
              'resource_url': 'https://www.envidat.ch/dataset/d8e61f31-c2e5-4052-8784-b1624dfbfc40/resource/cef4a88c-0ef6-4327-a4a0-fc7d33b468e5/download/rejichacko_etal_2025_envidat.zip',
              'resource_sha256': digest,
              'betterblooms_repository': 'mrejichacko/BetterBlooms',
              'betterblooms_commit': source_commit,
              'raw_data_committed_here': False,
          }
          target = Path('artifacts/empirical/e2_zurich_source_manifest.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Validate result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/empirical/e2_zurich_residual_context.json').read_text())
          assert data['status'] == 'e2_zurich_residual_context_audit_complete'
          assert data['source_commit'] == 'd6361f6874398e797322afe07a8fea85a3c7e927'
          assert data['source_data_doi'] == '10.16904/envidat.676'
          assert data['validation'] == 'leave_one_garden_out'
          assert len(data['endpoint_results']) == 6
          allowed = {
              'ecological_partial_state_incomplete',
              'no_detected_residual_urban_information',
              'not_identifiable_from_archive',
          }
          assert all(row['decision'] in allowed for row in data['endpoint_results'])
          assert any(row['decision'] != 'not_identifiable_from_archive' for row in data['endpoint_results']), (
              'all six endpoints were non-identifiable; inspect the locked data/schema rather than changing predictors silently'
          )
          print(json.dumps(data['decision_counts'], indent=2))
          PY

      - name: Upload E2 evidence only
        uses: actions/upload-artifact@v4
        with:
          name: e2-zurich-residual-context-audit
          path: |
            artifacts/empirical/e2_zurich_residual_context.json
            artifacts/empirical/e2_zurich_source_manifest.json
          if-no-files-found: error
          retention-days: 90
