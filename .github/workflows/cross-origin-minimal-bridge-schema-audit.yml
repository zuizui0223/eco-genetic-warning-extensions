name: Cross-origin minimal bridge schema audit

on:
  push:
    branches:
      - agent/cross-origin-minimal-bridge-audit
    paths:
      - "manuscript/empirical_cross_origin_minimal_bridge_preregistration.md"
      - "scripts/audit_cross_origin_candidate_schemas.py"
      - ".github/workflows/cross-origin-minimal-bridge-schema-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout locked candidate protocol
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install schema-only readers
        run: python -m pip install --upgrade pandas openpyxl xlrd

      - name: Compile audit script
        run: python -m py_compile scripts/audit_cross_origin_candidate_schemas.py

      - name: Download locked Dryad packages and inspect schemas only
        run: |
          python scripts/audit_cross_origin_candidate_schemas.py \
            --output artifacts/empirical/cross_origin_minimal_bridge_schema_audit.json

      - name: Validate response firewall and candidate lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/empirical/cross_origin_minimal_bridge_schema_audit.json')
          data = json.loads(path.read_text())
          assert data['analysis'] == 'response_firewalled_cross_origin_minimal_bridge_schema_audit'
          assert len(data['candidate_lock']) == 4
          assert {x['id'] for x in data['candidate_lock']} == {
              'U1_commelina', 'U2_chicago', 'I1_hiraiwa2017', 'I2_hawaii2019'
          }
          assert data['summary']['locked_candidates_by_origin'] == {'urban': 2, 'island': 2}
          boundary = data['inspection_boundary'].lower()
          assert 'no reproductive outcome values' in boundary
          assert 'fitted effects' in boundary
          for candidate in data['candidates'].values():
              assert 'schema_records' in candidate
              assert 'decision' in candidate
          print(json.dumps(data['summary'], indent=2, sort_keys=True))
          PY

      - name: Upload schema-only audit
        uses: actions/upload-artifact@v4
        with:
          name: cross-origin-minimal-bridge-schema-audit
          path: artifacts/empirical/cross_origin_minimal_bridge_schema_audit.json
          if-no-files-found: error
          retention-days: 30
