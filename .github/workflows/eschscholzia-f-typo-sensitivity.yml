name: Eschscholzia post-review F typo sensitivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prospective sensitivity protocol
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked analysis dependencies
        run: python -m pip install --upgrade numpy pandas scikit-learn

      - name: Run F-only post-review sensitivity
        run: |
          python scripts/run_eschscholzia_f_typo_sensitivity.py \
            --output artifacts/empirical/eschscholzia_f_typo_sensitivity_stop.json

      - name: Validate non-rescue and one-correction contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('artifacts/empirical/eschscholzia_f_typo_sensitivity_stop.json').read_text())
          assert data['analysis'] == 'postreview_secondary_typo_sensitivity'
          assert data['decision'] == 'stop_pre_model_unexpected_second_metadata_mismatch'
          assert data['primary_lock']['decision'] == 'multi_endpoint_not_identifiable'
          assert data['primary_lock']['status'] == 'unchanged_not_rescued_or_reclassified'
          assert data['metadata_preflight']['distinct_mismatch_keys'] == ['1||3', '1||4']
          assert data['information_boundary']['f_model_fitted'] is False
          assert data['information_boundary']['model_score_calculated'] is False
          assert data['information_boundary']['bootstrap_run'] is False
          assert data['information_boundary']['other_endpoints_rerun'] is False
          assert 'F_seed_secondary_sensitivity' not in data
          PY

      - name: Upload secondary result only
        uses: actions/upload-artifact@v4
        with:
          name: eschscholzia-f-typo-sensitivity-stop
          path: artifacts/empirical/eschscholzia_f_typo_sensitivity_stop.json
          if-no-files-found: error
          retention-days: 30
