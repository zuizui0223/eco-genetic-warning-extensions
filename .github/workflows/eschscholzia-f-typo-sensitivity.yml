name: Eschscholzia post-review F typo sensitivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prospective sensitivity protocol
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked analysis dependencies
        run: python -m pip install --upgrade numpy pandas scikit-learn

      - name: Run F-only post-review sensitivity
        run: |
          python scripts/run_eschscholzia_f_typo_sensitivity.py \
            --output artifacts/empirical/eschscholzia_f_typo_sensitivity_result.json

      - name: Validate non-rescue and one-correction contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('artifacts/empirical/eschscholzia_f_typo_sensitivity_result.json').read_text())
          assert data['analysis'] == 'postreview_secondary_typo_sensitivity'
          assert data['primary_lock']['decision'] == 'multi_endpoint_not_identifiable'
          assert data['primary_lock']['status'] == 'unchanged_not_rescued_or_reclassified'
          assert data['correction'] == {
              'source_role': 'f_seed',
              'array_key': '1||3',
              'field': 'Habitat',
              'observed': 'Fallow graound',
              'replacement': 'Fallow ground',
              'corrected_rows': data['correction']['corrected_rows'],
              'mismatch_count_before': 1,
              'mismatch_count_after': 0,
          }
          assert data['correction']['corrected_rows'] > 0
          assert data['frozen_analysis']['bootstrap_replicates'] == 10000
          assert data['frozen_analysis']['bootstrap_rng_seed'] == 20260825
          assert data['frozen_analysis']['other_endpoints_rerun'] is False
          assert 'F_seed_secondary_sensitivity' in data
          PY

      - name: Upload secondary result only
        uses: actions/upload-artifact@v4
        with:
          name: eschscholzia-f-typo-sensitivity-result
          path: artifacts/empirical/eschscholzia_f_typo_sensitivity_result.json
          if-no-files-found: error
          retention-days: 30
