name: Apply v4 review revisions

on:
  push:
    branches: [agent/address-identification-review]
    paths:
      - 'scripts/apply_review_v4_patch.py'
      - '.github/workflows/apply-review-v4.yml'

permissions:
  contents: write
  actions: read

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/address-identification-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic review patch
        run: python scripts/apply_review_v4_patch.py
      - name: Materialize immutable Stage III trajectory records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -e .
          mkdir -p /tmp/stage3/domain0 /tmp/stage3/domain1
          gh run download 29417632137 -n protocol003-stage3-validation-domain-0 -D /tmp/stage3/domain0
          gh run download 29417632137 -n protocol003-stage3-validation-domain-1 -D /tmp/stage3/domain1
          python -m eco_genetic_warning_extensions.stage3_trajectory_records \
            /tmp/stage3/domain0/stage3_validation_domain_0.json \
            /tmp/stage3/domain1/stage3_validation_domain_1.json \
            manuscript/tables/stage3_trajectory_endpoint_records.csv
          test "$(($(wc -l < manuscript/tables/stage3_trajectory_endpoint_records.csv)-1))" -eq 1200
      - name: Verify revised claims
        run: |
          grep -q 'conditional estimand' manuscript/main_text.md
          grep -q '−97.0.*−3.5' manuscript/main_text.md
          grep -q 'Figure 4 therefore provides the primary Stage III timing evidence' manuscript/main_text.md
          grep -q 'Field & Welsh 2007' manuscript/main_text.md
          grep -q 'Frankham 2005' manuscript/main_text.md
          grep -q 'Lipsitch et al. 2010' manuscript/main_text.md
          ! grep -q 'Direct D−S bootstrap' src/eco_genetic_warning_extensions/publication_figures.py
          cmp manuscript/main_text.md manuscript/supervisor_first_draft.md
      - name: Commit v4 revision and audit records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/main_text.md manuscript/supervisor_first_draft.md manuscript/figure_captions.md manuscript/references.md manuscript/tables/stage3_trajectory_endpoint_records.csv src/eco_genetic_warning_extensions/publication_figures.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Apply v4 estimand and presentation revisions [skip ci]'
            git push origin HEAD:agent/address-identification-review
          fi
