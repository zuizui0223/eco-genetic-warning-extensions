name: Relational mechanism decomposition — locked reproduction

# The prospective scientific run is complete and frozen at workflow run 34012983845,
# artifact 9983093178. This workflow is retained only for explicit manual reproduction;
# PR synchronization must not silently generate new scientific ensembles.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
      - name: Checkout pinned parent simulator
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: b7ee738767c92307d6d23a85a3eeb857faf6ddfb
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parent and extension
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e upstream
          python -m pip install -e .
      - name: Verify analytic mechanism before simulation
        run: python -m pytest -q tests/test_relational_mechanism_decomposition.py
      - name: Reproduce locked prospective mechanism experiment
        run: |
          mkdir -p mechanism_output
          python scripts/run_relational_mechanism_decomposition.py \
            --summary mechanism_output/summary.json \
            --records mechanism_output/records.json
      - name: Verify locked headline contract
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          s=json.loads(Path('mechanism_output/summary.json').read_text())
          assert s['status']=='completed_from_locked_protocol'
          h=s['analytic_headline']
          assert math.isclose(h['AA_RR_support_mean_difference'],0.0,abs_tol=1e-12)
          assert math.isclose(h['AA_RR_support_variance_ratio'],49.0,abs_tol=1e-12)
          assert len(s['paired_primary'])==4
          assert set(s['factorial_loss_decomposition'])=={'20','40'}
          PY
      - name: Upload reproduced mechanism results
        uses: actions/upload-artifact@v4
        with:
          name: relational-mechanism-decomposition-reproduction
          path: mechanism_output/
          if-no-files-found: error
