name: Relational mechanism decomposition

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/relational_mechanism_decomposition_protocol.json'
      - 'src/eco_genetic_warning_extensions/relational_mechanism_decomposition.py'
      - 'scripts/run_relational_mechanism_decomposition.py'
      - 'tests/test_relational_mechanism_decomposition.py'
      - '.github/workflows/relational-mechanism-decomposition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
      - name: Checkout pinned parent simulator
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/eco-genetic-criticality
          ref: b7ee738767c92307d6d23a85a3eeb857faf6ddfb
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parent and extension
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e upstream
          python -m pip install -e .
      - name: Verify analytic mechanism before simulation
        run: python -m pytest -q tests/test_relational_mechanism_decomposition.py
      - name: Run locked prospective mechanism experiment
        run: |
          mkdir -p mechanism_output
          python scripts/run_relational_mechanism_decomposition.py \
            --summary mechanism_output/summary.json \
            --records mechanism_output/records.json
      - name: Verify locked headline contract
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          s=json.loads(Path('mechanism_output/summary.json').read_text())
          assert s['status']=='completed_from_locked_protocol'
          h=s['analytic_headline']
          assert math.isclose(h['AA_RR_support_mean_difference'],0.0,abs_tol=1e-12)
          assert math.isclose(h['AA_RR_support_variance_ratio'],49.0,abs_tol=1e-12)
          assert len(s['paired_primary'])==4
          assert set(s['factorial_loss_decomposition'])=={'20','40'}
          print(json.dumps({
            'analytic_headline': h,
            'paired_primary': s['paired_primary'],
            'factorial_loss_decomposition': s['factorial_loss_decomposition'],
            'AA_full_cells': s['trajectory_cells']['AA_full'],
            'RR_full_cells': s['trajectory_cells']['RR_full'],
            'AA_q_only_cells': s['trajectory_cells']['AA_q_only'],
            'RR_q_only_cells': s['trajectory_cells']['RR_q_only'],
          }, indent=2))
          PY
      - name: Upload locked mechanism results
        uses: actions/upload-artifact@v4
        with:
          name: relational-mechanism-decomposition
          path: mechanism_output/
          if-no-files-found: error
