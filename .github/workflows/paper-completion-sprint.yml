name: Paper completion sprint

on:
  pull_request:
    branches: [main]
    paths:
      - "manuscript/**"
      - "scripts/build_submission_bundle.py"
      - "src/eco_genetic_warning_extensions/publication_figures.py"
      - "src/eco_genetic_warning_extensions/protocol002_publication_outputs.py"
      - "artifacts/protocol003/stage3_validation_summary.json"
      - ".github/workflows/paper-completion-sprint.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-submission-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current figure generators
        run: python -m pip install -e .
      - name: Download locked publication data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p locked/stage1 locked/stage2
          gh run download 29422431944 -n publication-stage1-stage3-outputs -D locked/stage1
          gh run download 29399936061 -n protocol002-publication-outputs -D locked/stage2
      - name: Build complete submission bundle
        run: |
          python scripts/build_submission_bundle.py \
            --stage1-dir locked/stage1 \
            --stage2-dir locked/stage2 \
            --repo-root . \
            --output submission_bundle
      - name: Validate package contents and current figure generation
        run: |
          test -f submission_bundle/manifest.json
          test "$(find submission_bundle/figures -name '*.svg' | wc -l)" -eq 6
          test "$(find submission_bundle/tables -type f | wc -l)" -ge 4
          grep -q '2,269' submission_bundle/manuscript/main_text.md
          grep -q '323' submission_bundle/manuscript/main_text.md
          grep -q '184' submission_bundle/manuscript/main_text.md
          grep -q 'Source feasibility across transition coordinates' submission_bundle/figures/figure2_stage1_source_feasibility.svg
          grep -q 'Functional-loss regimes across transition coordinates' submission_bundle/figures/figure3_stage2_coordinate_regimes.svg
          grep -q 'Warning ordering in calibrated domains' submission_bundle/figures/figure5_stage3_ordering.svg
          grep -q 'Median positive warning lead time' submission_bundle/figures/figure6_stage3_lead_time.svg
          ! grep -R -qE 'Stage I source-feasibility map|Stage III warning ordering|Stage III median positive lead time|Protocol 002 trait-loss regimes' submission_bundle/figures
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('submission_bundle/tables/stage1_publication_summary.json').read_text())
          assert data['attempt_count']==3375
          assert data['totals']['projection_supported']==2269
          assert data['totals']['projection_failed']==0
          for path in sorted(Path('submission_bundle/figures').glob('*.svg')):
              text=path.read_text(encoding='utf-8')
              assert 'role="img"' in text, path
              assert '<title ' in text or '<title>' in text, path
              assert '<desc ' in text or '<desc>' in text, path
          PY
      - name: Upload submission bundle
        uses: actions/upload-artifact@v4
        with:
          name: eco-genetic-warning-submission-bundle
          path: submission_bundle
          if-no-files-found: error
